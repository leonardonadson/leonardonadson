name: Atualizar cards do perfil

on:
  schedule:
    - cron: "17 3 * * *" # todo dia, 00:17 no horário de Brasília/Natal
  workflow_dispatch: # botão "Run workflow" na aba Actions
  push:
    branches: [main]
    paths: [".github/workflows/profile-cards.yml"]

permissions:
  contents: write

jobs:
  # Gera os cards de estatísticas como SVG e faz commit em profile-summary-card-output/
  summary-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Use um token pessoal (secret SUMMARY_GITHUB_TOKEN) para dados mais completos;
          # sem ele, o token padrão do Actions é usado.
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: -3
          THEME: tokyonight

  # Gera a cobrinha que come o gráfico de contribuições e publica no branch "output"
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#7aa2f7
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#bb9af7
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
